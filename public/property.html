<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a20;--gold:#b18a52;--sand:#f7f3ed;--line:#e8e0d5;--muted:#74695e}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Manrope,Arial,sans-serif;background:#fff}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 26px}
nav{position:sticky;top:0;z-index:5;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.navin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font:25px 'DM Serif Display',Georgia,serif}.navlinks{display:flex;gap:24px;font-size:12px;font-weight:700}.contact{background:var(--gold);color:#fff;padding:12px 18px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
main{padding:34px 0 80px}.crumb{font-size:12px;color:var(--muted);margin:5px 0 25px}.crumb a{color:var(--gold)}.topline{display:flex;justify-content:space-between;gap:20px;align-items:center}.status{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:700}.price{font:36px 'DM Serif Display',Georgia,serif}.title{font:clamp(36px,5vw,58px)/1.05 'DM Serif Display',Georgia,serif;margin:12px 0}.location{color:var(--muted);font-size:14px}
.gallery{display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:220px 220px;gap:10px;margin:30px 0}.gallery img{width:100%;height:100%;object-fit:cover;display:block;background:var(--sand)}.gallery img:first-child{grid-row:span 2}.gallery img:nth-child(n+4){display:none}
.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:55px;align-items:start}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.fact{padding:17px;background:var(--sand)}.fact strong{display:block;font:25px 'DM Serif Display',Georgia,serif}.fact span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.description{font-size:14px;line-height:1.95;color:#5f584f;white-space:pre-line}.side{border:1px solid var(--line);padding:28px;position:sticky;top:95px}.side h2{font:28px 'DM Serif Display',Georgia,serif;margin:0 0 12px}.side p{font-size:13px;line-height:1.8;color:var(--muted)}.btn{display:block;text-align:center;padding:15px;background:var(--gold);color:white;font-size:12px;font-weight:700;margin-top:12px}.btn.alt{background:var(--ink)}.loading,.error{padding:80px 0;text-align:center;color:var(--muted)}footer{background:var(--ink);color:#fff;padding:28px 0;font-size:12px}
@media(max-width:760px){.navlinks{display:none}.topline{align-items:flex-start;flex-direction:column}.gallery{grid-template-columns:1fr 1fr;grid-template-rows:250px 150px}.gallery img:first-child{grid-row:auto;grid-column:span 2}.gallery img:nth-child(n+4){display:none}.layout{grid-template-columns:1fr;gap:25px}.facts{grid-template-columns:repeat(2,1fr)}.side{position:static}.price{font-size:30px}}
</style></head>
<body><nav><div class="wrap navin"><a class="brand" href="/">WithBeasley</a><div class="navlinks"><a href="/">Home</a><a href="/properties">Properties</a><a href="/buy">Buy</a><a href="/sell">Sell</a><a href="/rent">Rent</a><a href="/neighborhoods">Neighborhoods</a><a href="/guides">Guides</a></div><a class="contact" href="mailto:beasleymotion@gmail.com">Contact</a></div></nav>
<main class="wrap"><div id="content"><div class="loading">Loading property details…</div></div></main>
<footer><div class="wrap">WithBeasley · Independent local property search · San Miguel de Allende, Guanajuato, Mexico</div></footer>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c)=>{const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:c==='MXN'?'MXN':'USD',maximumFractionDigits:0}).format(n):'Price on request'};
const size=v=>{const n=Number(v);return n>0?n.toLocaleString('en-US')+' m²':''};
const slug=new URLSearchParams(location.search).get('slug')||location.pathname.split('/').filter(Boolean).pop();
async function load(){const root=document.getElementById('content');try{const res=await fetch('/api/properties/'+encodeURIComponent(slug));const data=await res.json();if(!res.ok||!data.ok||!data.property)throw Error(data.error||'Property not found');const p=data.property;const images=Array.isArray(p.images)?p.images.map(x=>typeof x==='string'?x:x?.url).filter(Boolean):[];const all=[p.og_image,p.featured_image,...images].filter((x,i,a)=>x&&a.indexOf(x)===i);const facts=[['Bedrooms',p.bedrooms],['Bathrooms',p.bathrooms],['Construction',size(p.construction_size)],['Lot size',size(p.lot_size)]].filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=='');const status=p.status==='for_rent'?'For Rent':p.status==='sold'?'Sold':p.status==='pending'?'Pending':'For Sale';const subject=encodeURIComponent('Property inquiry: '+(p.title||'San Miguel property'));const body=encodeURIComponent('Hello, I would like more information about '+(p.title||'this property')+'.\n\nProperty link: '+location.href);root.innerHTML='<div class="crumb"><a href="/">Home</a> / <a href="/properties">Properties</a> / '+esc(p.title||'Property')+'</div><div class="topline"><div><div class="status">'+status+'</div><h1 class="title">'+esc(p.title||'San Miguel de Allende Property')+'</h1><div class="location">'+esc(p.neighborhood||p.address||'San Miguel de Allende, Guanajuato, Mexico')+'</div></div><div class="price">'+money(p.price,p.currency)+'</div></div><div class="gallery">'+(all.length?all.slice(0,4).map((u,i)=>'<img src="'+esc(u)+'" alt="'+esc(p.title||'Property photo')+' '+(i+1)+'" '+(i?'loading="lazy"':'fetchpriority="high"')+'>').join(''):'<div style="grid-column:1/-1;background:var(--sand);display:grid;place-items:center;color:var(--muted)">Photos available on request</div>')+'</div><div class="layout"><section><div class="facts">'+facts.map(x=>'<div class="fact"><strong>'+esc(x[1])+'</strong><span>'+x[0]+'</span></div>').join('')+'</div><h2 style="font:32px DM Serif Display,Georgia,serif">About this property</h2><div class="description">'+esc(p.description||'Contact WithBeasley for additional details, current availability and to arrange a viewing.')+'</div></section><aside class="side"><h2>Interested in this property?</h2><p>Ask a question, request additional photos or coordinate a viewing. We can help you understand the next steps and connect you with the appropriate local professionals.</p><a class="btn" href="mailto:beasleymotion@gmail.com?subject='+subject+'&body='+body+'">Request information</a><a class="btn alt" href="https://wa.me/12109157177?text='+encodeURIComponent('Hello, I am interested in '+(p.title||'this property')+'. '+location.href)+'">WhatsApp Blaze</a><p>Availability and pricing should be reconfirmed before making a decision.</p></aside></div>';}catch(e){root.innerHTML='<div class="error"><h1 style="font:40px DM Serif Display,Georgia,serif">Property details unavailable</h1><p>'+esc(e.message||'This listing may no longer be active.')+'</p><a class="btn" style="display:inline-block" href="/properties">Return to properties</a></div>'}}
load();
</script></body></html>
