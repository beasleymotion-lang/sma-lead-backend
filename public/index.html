<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Own Something Extraordinary | WithBeasley</title><style>body{font-family:Arial,sans-serif;margin:0;padding:48px;color:#111}h1{font-size:48px;margin:0 0 12px}p{font-size:18px}</style></head><body><h1>Own Something Extraordinary.</h1><p>San Miguel de Allende properties, presented directly by WithBeasley.</p><script>const API='https://sma-lead-backend.onrender.com';fetch(API+'/api/properties').then(r=>r.json()).then(data=>{const ps=Array.isArray(data)?data:(data.properties||[]);const el=document.createElement('section');el.style.marginTop='40px';el.innerHTML='<h2>Featured Properties</h2>'+ps.map(p=>{const lot=p.lot_size!=null&&p.lot_size!==''?Number(p.lot_size).toLocaleString()+' m²':'';return '<article style="padding:20px 0;border-bottom:1px solid #ddd"><h3>'+((p.title||p.name||'Property').replace(/</g,'&lt;'))+'</h3>'+(lot?'<p><strong>Lot size:</strong> '+lot+'</p>':'')+'</article>'}).join('');document.body.appendChild(el)}).catch(()=>{});</script></body></html>
