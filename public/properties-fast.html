<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Properties | WithBeasley</title><meta name="description" content="Explore current properties for sale and rent in San Miguel de Allende with WithBeasley."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@0,9..144,400;0,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ivory:#FAF7F1;--ivory2:#F2EDE3;--black:#15130F;--charcoal:#403E38;--gold:#A9834C;--line:rgba(21,19,15,.12);--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--charcoal);font-family:Manrope,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1240px;margin:auto;padding:0 32px}@media(max-width:640px){.wrap{padding:0 20px}}nav{height:76px;background:rgba(250,247,241,.96);border-bottom:1px solid var(--line);display:flex;align-items:center}.navin{display:flex;justify-content:space-between;align-items:center}.logo{font:500 22px Fraunces,serif;color:var(--black)}.back{font-size:13px;font-weight:600}.back:hover{color:var(--gold)}header{padding:72px 0 42px}h1{font:400 clamp(42px,6vw,70px) Fraunces,serif;color:var(--black);margin:10px 0 16px}header p{max-width:650px;font-size:16px;line-height:1.7}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}.toolbar{display:flex;gap:12px;flex-wrap:wrap;padding:18px;background:var(--white);border:1px solid var(--line);border-radius:8px;margin-bottom:34px}.toolbar select{border:1px solid var(--line);background:var(--white);padding:12px 14px;border-radius:4px;font:500 13px Manrope,sans-serif}.count{margin-left:auto;align-self:center;font-size:12px;color:#777}@media(max-width:700px){.count{width:100%;margin-left:0}}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-bottom:80px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}}.card{background:var(--white);border:1px solid var(--line);border-radius:7px;overflow:hidden;transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(21,19,15,.12)}.photo{height:245px;background:var(--ivory2);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:20px}.status{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:700}.title{font:500 24px Fraunces,serif;color:var(--black);margin:8px 0}.location{font-size:12px;color:#777;margin-bottom:14px}.price{font-size:17px;font-weight:700;color:var(--black)}.meta{display:flex;gap:16px;font-size:12px;margin-top:14px;color:#666}.empty,.loading{padding:50px;text-align:center;background:var(--white);border:1px solid var(--line);border-radius:8px;grid-column:1/-1}.loading{min-height:120px}.error{color:#8b3d2f}</style></head><body><nav><div class="wrap navin"><a class="logo" href="/">Blaze Beasley</a><a class="back" href="/">← Back to home</a></div></nav><main class="wrap"><header><div class="eyebrow">San Miguel de Allende</div><h1>Properties</h1><p>Explore the current homes, land, and other properties available through WithBeasley. Browse everything in one organized place, then open any listing for the full details.</p></header><div class="toolbar"><select id="status"><option value="for_sale">For Sale</option><option value="for_rent">For Rent</option><option value="pending">Pending</option><option value="sold">Sold</option></select><select id="type"><option value="">All property types</option><option>House</option><option>Condo</option><option>Land</option><option>Commercial</option><option>Villa</option></select><select id="sort"><option value="newest">Newest first</option><option value="price_low">Price low to high</option><option value="price_high">Price high to low</option></select><span class="count" id="count"></span></div><section id="grid" class="grid"></section></main><script>
const grid=document.getElementById('grid'),count=document.getElementById('count');
const DATA=[{"id":29,"slug":"30-hectare-development-land","title":"30 Hectare Development Land","price":32000000,"currency":"MXN","status":"for_sale","property_type":"Land / Development Land","neighborhood":"San Miguel de Allende","bedrooms":null,"bathrooms":null,"lot_size":300000,"featured_image":"https://udvanfsyrwzqvucmxxzk.supabase.co/storage/v1/object/public/property-images/properties/1789195834422_0_29e2ee50.jpg"},{"id":28,"slug":"premium-development-land-in-san-antonio","title":"Premium Development Land in San Antonio","price":11000000,"currency":"MXN","status":"for_sale","property_type":"Land / Development Land","neighborhood":"Colonia San Antonio","lot_size":1055,"featured_image":"https://udvanfsyrwzqvucmxxzk.supabase.co/storage/v1/object/public/property-images/properties/1789195480288_0_d3f3e0fa.jpg"},{"id":27,"slug":"commercial-property-salida-a-celaya-93","title":"Commercial Property — Salida a Celaya 93","price":80000000,"currency":"MXN","status":"for_sale","property_type":"Commercial Property","neighborhood":"Centro","bedrooms":null,"bathrooms":null,"lot_size":4171.69,"featured_image":"https://udvanfsyrwzqvucmxxzk.supabase.co/storage/v1/object/public/property-images/properties/1789184430863_0_23c2d1da.jpg"},{"id":26,"slug":"hectarea-emilia","title":"Hectárea Emilia","price":15000000,"currency":"USD","status":"for_sale","property_type":"Land / Development Land","neighborhood":"San Miguel de Allende","lot_size":10000,"featured_image":"https://udvanfsyrwzqvucmxxzk.supabase.co/storage/v1/object/public/property-images/properties/1789184011476_0_f23d02f0.jpg"},{"id":25,"slug":"prime-lot-in-fracc","title":"Prime Lot in Fracc,","price":1550000,"currency":"MXN","status":"for_sale","property_type":"Land and Lots","neighborhood":"Independencia","lot_size":220.24,"featured_image":"https://udvanfsyrwzqvucmxxzk.supabase.co/storage/v1/object/public/property-images/properties/1789042054573_0_4cfb8d40.jpg"},{"id":24,"slug":"lote-agave-vista-antigua","title":"Lote Agave ty_type":"House","neighborhood":"club de golf ventanas","bedrooms":4,"bathrooms":3,"lot_size":100,"featured_image":"https://udvanfsyrwzqvucmxxzk.supabase.co/storage/v1/object/public/property-images/properties/1788662566015_0_7f8ae0ee.jpg"}];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=(v,c)=>{const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:c==='MXN'?'MXN':'USD',maximumFractionDigits:0}).format(n):''};
function sortList(list){const s=document.getElementById('sort').value,a=[...list];if(s==='price_low')a.sort((x,y)=>(x.price||0)-(y.price||0));if(s==='price_high')a.sort((x,y)=>(y.price||0)-(x.price||0));return a}
function render(list){count.textContent=list.length+' propert'+(list.length===1?'y':'ies');if(!list.length){grid.innerHTML='<div class="empty">No properties match these filters right now.</div>';return}grid.innerHTML=list.map((p,i)=>{const title=p.title||p.name||'Property',img=p.og_image||p.featured_image||(p.images?.[0]?.url)||'';return `<a class="card" href="/properties/${encodeURIComponent(p.slug||p.id)}"><div class="photo">${img?`<img src="${esc(img)}" alt="${esc(title)}" ${i<3?'fetchpriority="high"':'loading="lazy"'} decoding="async">`:''}</div><div class="body"><div class="status">${esc(String(p.status||'').replaceAll('_',' '))}</div><div class="title">${esc(title)}</div><div class="location">${esc(p.neighborhood||p.address||'San Miguel de Allende')}</div><div class="price">${money(p.price,p.currency)}</div><div class="meta">${p.bedrooms?`<span>${esc(p.bedrooms)} beds</span>`:''}${p.bathrooms?`<span>${esc(p.bathrooms)} baths</span>`:''}${p.lot_size?`<span>${Number(p.lot_size).toLocaleString('en-US')} m² lot</span>`:''}</div></div></a>`}).join('')}
function save(list){try{localStorage.setItem('wb_props_fast',JSON.stringify(list))}catch{}}
function local(){const status=document.getElementById('status').value,type=document.getElementById('type').value;return sortList(DATA.filter(p=>(!status||p.status===status)&&(!type||String(p.property_type||'').toLowerCase().includes(type.toLowerCase()))))}
async function load(){let cached=null;try{cached=JSON.parse(localStorage.getItem('wb_props_fast'))}catch{}render(cached?.length?sortList(cached):local());try{const status=document.getElementById('status').value,type=document.getElementById('type').value,q=new URLSearchParams({status});if(type)q.set('propertyType',type);const r=await fetch('/api/properties?'+q,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),list=Array.isArray(d.properties)?d.properties:[];if(list.length){save(list);render(sortList(list))}}catch(e){}}
document.querySelectorAll('select').forEach(x=>x.addEventListener('change',load));load();
</script></body></html>
