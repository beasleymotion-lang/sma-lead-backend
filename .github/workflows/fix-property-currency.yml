name: Patch property currency display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct property currency behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("const currency = { rate: 17.8, mode: 'USD' };", "const currency = { rate: 17.8, mode: null };"),
            ("  const source = String(propertyCurrency || 'USD').toUpperCase();\n  const val = source === currency.mode ? v : (currency.mode === 'USD' ? Math.round(v/currency.rate) : Math.round(v*currency.rate));", "  const source = String(propertyCurrency || 'USD').toUpperCase();\n  const target = currency.mode || source;\n  const val = source === target ? v : (target === 'USD' ? Math.round(v/currency.rate) : Math.round(v*currency.rate));"),
            ("currency.mode==='USD' ? 'USD':'MXN'", "(currency.mode || l.currency || 'USD')==='USD' ? 'USD':'MXN'"),
            ("currency.mode === 'USD' ? 'USD' : 'MXN'", "(currency.mode || property.currency || 'USD') === 'USD' ? 'USD' : 'MXN'"),
            ("currency.mode = btn.dataset.cur;\n  document.querySelectorAll('#currency-toggle button').forEach(b=>b.classList.toggle('active', b===btn));", "currency.mode = btn.dataset.cur;\n  document.querySelectorAll('#currency-toggle button').forEach(b=>b.classList.toggle('active', b===btn));"),
          ]
          for a,b in replacements:
            if a not in s:
              print('Expected text not found:', a[:100])
            else:
              s = s.replace(a,b)
          marker = "    listings = data.properties.map(cmsPropertyToListing);"
          inject = marker + "\n      if (listings.length && !currency.mode) {\n        currency.mode = listings[0].currency || 'USD';\n        document.querySelectorAll('#currency-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.cur === currency.mode));\n      }"
          if marker in s and "if (listings.length && !currency.mode)" not in s:
            s = s.replace(marker, inject, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: default listings to stored currency"
          git push