name: Fix property detail currency permanently

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix detail price fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # If a listing has no currency on the object during the initial detail render,
          # do NOT assume USD and convert it. Use the current display currency as the
          # fallback. Listings loaded from CMS still use their stored currency when present.
          s, n = re.subn(
              r"const source = String\(propertyCurrency \|\| 'USD'\)\.toUpperCase\(\);",
              "const source = String(propertyCurrency || currency.mode || 'USD').toUpperCase();",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Expected fmtPrice source line not found exactly once; found {n}. Refusing blind patch.')

          # Ensure the normalized CMS listing always carries its stored currency.
          marker = 'function cmsPropertyToListing(p, idx){'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('cmsPropertyToListing not found')
          ret = s.find('return {', pos)
          end = s.find('};', ret)
          block = s[ret:end]
          if "currency: String(p.currency || 'USD').toUpperCase()," not in block:
              idpos = s.find('id: p.id,', ret)
              if idpos < 0:
                  raise SystemExit('cmsPropertyToListing id field not found')
              line_end = s.find('\n', idpos)
              s = s[:line_end+1] + "    currency: String(p.currency || 'USD').toUpperCase(),\n" + s[line_end+1:]

          # Every detail price call must pass the listing's stored currency.
          replacements = [
              ("fmtPrice(l.price,l.mode==='rent')", "fmtPrice(l.price,l.mode==='rent',l.currency)"),
              ("fmtPrice(l.price, l.mode==='rent')", "fmtPrice(l.price, l.mode==='rent', l.currency)"),
              ("fmtPrice(l.price, l.mode === 'rent')", "fmtPrice(l.price, l.mode === 'rent', l.currency)"),
              ("typeof fmtPrice==='function'?fmtPrice(l.price,l.mode==='rent')", "typeof fmtPrice==='function'?fmtPrice(l.price,l.mode==='rent',l.currency)"),
              ("typeof fmtPrice === 'function' ? fmtPrice(l.price, l.mode === 'rent')", "typeof fmtPrice === 'function' ? fmtPrice(l.price, l.mode === 'rent', l.currency)"),
          ]
          for old, new in replacements:
              s = s.replace(old, new)

          if s == original:
              raise SystemExit('No changes made; refusing no-op commit.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "fix: make property currency safe for detail pages"
          git push
