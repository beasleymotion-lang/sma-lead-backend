name: Fix homepage headline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Restore original homepage and change only the headline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original design and replace headline
        shell: bash
        run: |
          git checkout 747b2379543a5ed0f364b3f17af6459591fb0c0f -- public/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(<h1\b[^>]*>)(.*?)(</h1>)'
          matches = list(re.finditer(pattern, s, flags=re.I | re.S))
          if not matches:
              raise SystemExit('No h1 found in the original homepage')
          # The original homepage has a single hero h1. Replace only its visible text.
          m = matches[0]
          old = m.group(2)
          print('Original hero h1:', re.sub(r'<[^>]+>', '', old).strip())
          replacement = m.group(1) + 'Own Something Extraordinary.' + m.group(3)
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/fix-homepage-headline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html .github/workflows/fix-homepage-headline.yml
          git commit -m 'Change homepage headline only'
          git push origin main
