name: Apply property price fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix property card price formatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r"function\s+fmtPrice\s*\([^)]*\)\s*\{[^}]*\}"
          replacement = "function fmtPrice(v, isRent, propertyCurrency, convert=true){ const val = Number(v); return '$' + (Number.isFinite(val) ? val.toLocaleString('en-US') : '') + (isRent ? '/mo' : ''); }"
          matches = re.findall(pattern, s)
          print('fmtPrice matches:', len(matches))
          for m in matches:
              print('FOUND:', m)
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Could not replace fmtPrice function; matches={n}')
          p.write_text(s, encoding='utf-8')
          print('fmtPrice replaced:', n)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git rm .github/workflows/fix-property-display.yml
          git commit -m "Fix property card prices to use listing currency"
          git push
