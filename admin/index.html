<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Blaze Beasley Real Estate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF7F1; --ivory-2:#F2EDE3; --charcoal:#2A2925; --charcoal-2:#403E38;
    --black:#15130F; --gold:#A9834C; --gold-light:#C9A876; --cantera:#C17358;
    --sage:#707B62; --line:rgba(21,19,15,0.1); --white:#FFFFFF;
    --shadow:0 20px 60px -20px rgba(21,19,15,0.25); --shadow-sm:0 8px 24px -12px rgba(21,19,15,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ivory); color:var(--charcoal); font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Fraunces',serif; font-weight:500; color:var(--black);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--gold); color:#fff;}

  /* ---------- Login ---------- */
  #login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--black); padding:20px;}
  .login-card{background:var(--white); border-radius:10px; padding:44px 40px; max-width:380px; width:100%; box-shadow:var(--shadow);}
  .login-card .logo{font-family:'Fraunces',serif; font-size:22px; text-align:center; margin-bottom:6px;}
  .login-card .sub{text-align:center; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:30px; font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:16px;}
  .field label{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; color:var(--charcoal-2); display:block; margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:4px; font-size:14px; background:var(--ivory);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold); outline-offset:1px; background:#fff;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border-radius:4px; font-size:13.5px; font-weight:700; border:1px solid transparent; transition:all .25s ease;}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn-gold:hover{background:var(--black);}
  .btn-block{width:100%;}
  .btn-ghost{background:none; border-color:var(--line); color:var(--charcoal);}
  .btn-ghost:hover{border-color:var(--gold); color:var(--gold);}
  .btn-danger{background:none; border-color:var(--cantera); color:var(--cantera);}
  .btn-danger:hover{background:var(--cantera); color:#fff;}
  .btn-sm{padding:8px 14px; font-size:12px;}
  .login-error{background:rgba(193,115,88,0.1); border:1px solid var(--cantera); color:var(--cantera); font-size:13px; padding:10px 14px; border-radius:4px; margin-bottom:16px; display:none;}
  .login-error.show{display:block;}

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100vh; grid-template-columns:230px 1fr;}
  #app.show{display:grid;}
  #sidebar{background:var(--black); color:#fff; padding:26px 18px; display:flex; flex-direction:column;}
  #sidebar .logo{font-family:'Fraunces',serif; font-size:19px; margin-bottom:2px;}
  #sidebar .logo-sub{font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold-light); font-family:'IBM Plex Mono',monospace; margin-bottom:32px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:5px; font-size:13.5px; font-weight:600; color:rgba(255,255,255,0.65); margin-bottom:3px; border:none; background:none; width:100%; text-align:left;}
  .nav-item svg{width:16px; height:16px; stroke:currentColor; flex-shrink:0;}
  .nav-item:hover{color:#fff; background:rgba(255,255,255,0.06);}
  .nav-item.active{color:#fff; background:rgba(169,131,76,0.25);}
  #sidebar .spacer{flex:1;}
  #main{padding:34px 40px; overflow-x:hidden;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; gap:16px; flex-wrap:wrap;}
  .page-head h2{font-size:26px;}
  .page-head p{color:var(--charcoal-2); font-size:13.5px; margin-top:4px;}
  .view{display:none;}
  .view.active{display:block;}
  .toast{position:fixed; bottom:24px; right:24px; background:var(--black); color:#fff; padding:14px 20px; border-radius:6px; font-size:13.5px; box-shadow:var(--shadow); z-index:999; opacity:0; transform:translateY(10px); transition:all .3s ease; display:flex; align-items:center; gap:10px;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{background:var(--cantera);}
  .spinner{width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Stat cards ---------- */
  .stats-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:34px;}
  @media(max-width:1100px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--white); border:1px solid var(--line); border-radius:8px; padding:18px;}
  .stat-card .num{font-family:'Fraunces',serif; font-size:28px; color:var(--gold);}
  .stat-card .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--charcoal-2); margin-top:4px;}
  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media(max-width:900px){.dash-grid{grid-template-columns:1fr;}}
  .panel{background:var(--white); border:1px solid var(--line); border-radius:8px; padding:22px;}
  .panel h4{font-size:15px; margin-bottom:14px;}
  .panel-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .panel-row:last-child{border-bottom:none;}

  /* ---------- Table ---------- */
  .table-toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .table-toolbar input, .table-toolbar select{padding:9px 12px; border:1px solid var(--line); border-radius:4px; font-size:13px; background:#fff;}
  table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--charcoal-2); padding:12px 14px; background:var(--ivory-2); border-bottom:1px solid var(--line);}
  td{padding:12px 14px; font-size:13px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .thumb{width:44px; height:34px; border-radius:3px; object-fit:cover; background:var(--ivory-2);}
  .badge{display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:4px 9px; border-radius:999px;}
  .badge-for_sale{background:rgba(112,123,98,0.15); color:var(--sage);}
  .badge-for_rent{background:rgba(169,131,76,0.15); color:var(--gold);}
  .badge-pending{background:rgba(193,115,88,0.15); color:var(--cantera);}
  .badge-sold{background:rgba(21,19,15,0.08); color:var(--charcoal-2);}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .icon-btn{background:none; border:1px solid var(--line); border-radius:4px; width:28px; height:28px; display:flex; align-items:center; justify-content:center;}
  .icon-btn:hover{border-color:var(--gold); color:var(--gold);}
  .icon-btn svg{width:13px; height:13px;}
  .star-btn.active{color:var(--gold);}
  .star-btn.active svg{fill:var(--gold);}

  /* ---------- Property Form (modal) ---------- */
  #form-overlay{position:fixed; inset:0; background:rgba(21,19,15,0.6); z-index:500; display:none; align-items:flex-start; justify-content:center; padding:30px 20px; overflow-y:auto;}
  #form-overlay.show{display:flex;}
  .form-box{background:#fff; max-width:820px; width:100%; border-radius:10px; margin-bottom:40px;}
  .form-head{display:flex; justify-content:space-between; align-items:center; padding:22px 30px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; border-radius:10px 10px 0 0;}
  .form-head h3{font-size:19px;}
  .form-close{background:none; border:none; font-size:22px; color:var(--charcoal-2);}
  .form-body{padding:26px 30px;}
  .form-section{margin-bottom:26px;}
  .form-section-title{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold); font-weight:700; margin-bottom:14px;}
  .form-grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media(max-width:600px){.form-grid2,.form-grid3{grid-template-columns:1fr;}}
  .tag-input-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tag-chip{display:flex; align-items:center; gap:6px; background:var(--ivory-2); border-radius:999px; padding:5px 10px 5px 12px; font-size:12px;}
  .tag-chip button{background:none; border:none; color:var(--charcoal-2); font-size:14px; line-height:1;}
  .dropzone{border:2px dashed var(--line); border-radius:8px; padding:26px; text-align:center; color:var(--charcoal-2); font-size:13px; cursor:pointer; transition:all .2s ease;}
  .dropzone.dragover{border-color:var(--gold); background:var(--ivory-2);}
  .image-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px; margin-top:14px;}
  .image-tile{position:relative; aspect-ratio:1; border-radius:5px; overflow:hidden; border:1px solid var(--line);}
  .image-tile img{width:100%; height:100%; object-fit:cover;}
  .image-tile .rm{position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:rgba(21,19,15,0.7); color:#fff; border:none; font-size:13px; line-height:1;}
  .image-tile.featured::after{content:'Featured'; position:absolute; bottom:0; left:0; right:0; background:var(--gold); color:#fff; font-size:8.5px; text-align:center; padding:2px 0; text-transform:uppercase; letter-spacing:0.04em;}
  .form-footer{display:flex; justify-content:space-between; align-items:center; padding:20px 30px; border-top:1px solid var(--line); gap:12px; flex-wrap:wrap;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px;}

  /* ---------- CRM ---------- */
  .stage-select{padding:6px 10px; border-radius:4px; border:1px solid var(--line); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em;}
  .lead-card{background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:12px;}
  .lead-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .lead-name{font-weight:700; font-size:14px;}
  .lead-meta{font-size:12px; color:var(--charcoal-2); margin-top:2px;}
  .lead-notes{width:100%; margin-top:10px; padding:9px 11px; border:1px solid var(--line); border-radius:4px; font-size:12.5px; font-family:inherit; min-height:50px;}

  #empty-state{text-align:center; padding:60px 20px; color:var(--charcoal-2);}
  .hint{font-size:11.5px; color:var(--charcoal-2); opacity:0.75; margin-top:6px;}
  @media(max-width:760px){
    #app{grid-template-columns:1fr;}
    #sidebar{flex-direction:row; overflow-x:auto; padding:14px;}
    #sidebar .logo,#sidebar .logo-sub,#sidebar .spacer{display:none;}
    .nav-item{white-space:nowrap;}
    #main{padding:20px;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">Blaze Beasley</div>
    <div class="sub">Admin Dashboard</div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" required autofocus>
      </div>
      <button class="btn btn-gold btn-block" type="submit" id="login-btn">Sign In</button>
    </form>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app">
  <aside id="sidebar">
    <div class="logo">Blaze Beasley</div>
    <div class="logo-sub">Admin Dashboard</div>
    <button class="nav-item active" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Dashboard
    </button>
    <button class="nav-item" data-view="properties">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      Properties
    </button>
    <button class="nav-item" data-view="leads">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Leads (CRM)
    </button>
    <div class="spacer"></div>
    <button class="nav-item" id="logout-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Log Out
    </button>
  </aside>

  <main id="main">
    <!-- Views injected by admin.js -->
    <div class="view active" id="view-dashboard"></div>
    <div class="view" id="view-properties"></div>
    <div class="view" id="view-leads"></div>
  </main>
</div>

<!-- Property form modal -->
<div id="form-overlay"><div class="form-box" id="form-box"></div></div>

<div class="toast" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
